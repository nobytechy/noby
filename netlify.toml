# Netlify build configuration for noby.aizim.co.zw / nobie.netlify.app
#
# Set Supabase + any API keys under
# Site settings → Environment variables (never commit them here).

[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS    = "--legacy-peer-deps"

# Ask Noby chatbot — serverless functions (ESM, v2 streaming syntax).
# Without this block Netlify can silently skip the netlify/functions folder
# in some build setups, which returns the default 404 page when /api/chat
# is requested. Be explicit.
[functions]
  directory     = "netlify/functions"
  node_bundler  = "esbuild"

# /api/chat → Netlify Function (Ask Noby streaming endpoint)
# Keep these BEFORE the SPA fallback so the functions are reached first.
[[redirects]]
  from   = "/api/chat"
  to     = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from   = "/api/chat/suggest"
  to     = "/.netlify/functions/suggest"
  status = 200

# SPA fallback — React Router owns routing
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Long-cache hashed assets, never cache the HTML shell or service worker
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Netlify build configuration for noby.aizim.co.zw / nobie.netlify.app
#
# Set Supabase + any API keys under
# Site settings → Environment variables (never commit them here).

[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS    = "--legacy-peer-deps"

# SPA fallback — React Router owns routing
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Long-cache hashed assets, never cache the HTML shell or service worker
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
